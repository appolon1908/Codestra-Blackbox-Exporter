name: codestra-blackbox-exporter

services:
  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
      - --web.listen-address=0.0.0.0:9115
      - --log.level=info
      - --log.format=json
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - prometheus_blackbox
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

networks:
  prometheus_blackbox:
    external: true
    name: ${CODESTRA_PROMETHEUS_BLACKBOX_NETWORK:-codestra-prometheus-blackbox}
