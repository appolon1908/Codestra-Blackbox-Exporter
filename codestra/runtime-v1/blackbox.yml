modules:
  https_2xx_strict:
    prober: http
    timeout: 10s
    http:
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      valid_status_codes:
        - 200
        - 204
      method: GET
      follow_redirects: false
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      headers:
        Accept: application/json,text/plain;q=0.9,*/*;q=0.1
        User-Agent: Codestra-Blackbox/1.0
      tls_config:
        insecure_skip_verify: false
        min_version: TLS12

  https_redirect_chain:
    prober: http
    timeout: 15s
    http:
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      valid_status_codes:
        - 200
      method: GET
      follow_redirects: true
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      headers:
        User-Agent: Codestra-Blackbox/1.0
      tls_config:
        insecure_skip_verify: false
        min_version: TLS12

  https_health_json:
    prober: http
    timeout: 10s
    http:
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      valid_status_codes:
        - 200
      method: GET
      follow_redirects: false
      fail_if_not_ssl: true
      fail_if_body_not_matches_regexp:
        - '"(status|state)"[[:space:]]*:[[:space:]]*"(ok|healthy|ready|up)"'
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      headers:
        Accept: application/json
        User-Agent: Codestra-Blackbox/1.0
      tls_config:
        insecure_skip_verify: false
        min_version: TLS12

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false

  tcp_tls:
    prober: tcp
    timeout: 10s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      tls: true
      tls_config:
        insecure_skip_verify: false
        min_version: TLS12

  dns_codestra_media_a:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      query_name: codestra.media
      query_type: A
      valid_rcodes:
        - NOERROR
      validate_answer_rrs:
        fail_if_not_matches_regexp:
          - '.*[[:space:]]IN[[:space:]]+A[[:space:]]+.*'

  dns_codestra_co_a:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      query_name: codestra.co
      query_type: A
      valid_rcodes:
        - NOERROR
      validate_answer_rrs:
        fail_if_not_matches_regexp:
          - '.*[[:space:]]IN[[:space:]]+A[[:space:]]+.*'

  https_intake_readiness_json:
    prober: http
    timeout: 8s
    http:
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      valid_status_codes:
        - 200
      method: GET
      follow_redirects: false
      fail_if_not_ssl: true
      fail_if_body_not_matches_regexp:
        - '"(status|state)"[[:space:]]*:[[:space:]]*"(ok|healthy|ready|up)"'
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      headers:
        Accept: application/json
        User-Agent: Codestra-Blackbox/1.0
        X-Codestra-Probe-Class: intake-readiness
      tls_config:
        insecure_skip_verify: false
        min_version: TLS12
