modules:
  https_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: false

  http_2xx_internal:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200, 204]
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      follow_redirects: false

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false

  dns_codestra_a:
    prober: dns
    timeout: 5s
    dns:
      query_name: codestra.co
      query_type: A
      valid_rcodes: [NOERROR]
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      transport_protocol: udp

  icmp_private:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
