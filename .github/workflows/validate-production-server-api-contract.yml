name: Validate Codestra production server API contract

on:
  pull_request:
    paths:
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - .github/workflows/validate-production-server-api-contract.yml
  push:
    branches: [development, test, staging, production, main]
    paths:
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - .github/workflows/validate-production-server-api-contract.yml

permissions:
  contents: read

concurrency:
  group: blackbox-production-api-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Validate source-only production contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md').read_text(encoding='utf-8')
          required = [
              'appolon1908-hue/Codestra-Blackbox-Exporter', '37.27.128.39',
              'SOURCE_CONTRACT_PREPARED_NOT_DEPLOYED', 'GET` | `/-/healthy',
              'GET` | `/metrics', 'GET` | `/probe',
              'appolon1908-hue/Codestra-Prometheus` owns target discovery',
              'Target addresses must not be stored in this repository',
              'PROMETHEUS_TARGET_DISCOVERY_AND_ALLOWLIST=PASS',
              'BLACKBOX_REPOSITORY_TARGET_ADDRESSES=0',
              'TARGET_SOURCE=CODESTRA_PROMETHEUS',
              'GET_/probe_PROMETHEUS_ALLOWLISTED_TARGET=PASS',
              'GET_/probe_ARBITRARY_OPERATOR_TARGET=DENIED',
              'SSRF_TESTS=PASS', 'DNS_REBINDING_DENIED=PASS',
              'CREDENTIAL_TARGET_DENIED=PASS', 'UNEXPECTED_404=0',
              'SOURCE_RUNTIME_DRIFT=0', 'This document does not deploy Blackbox Exporter',
          ]
          missing = [value for value in required if value not in text]
          assert not missing, f'missing production API contract controls: {missing}'
          forbidden = [
              'Blackbox Exporter owns probe modules, target allowlists',
              'Fix modules, allowlists, validation, or runtime configuration here',
              'ADMIN_BYPASS_AUTHORIZED=YES',
              'SSH_CONFIGURATION_CHANGES_AUTHORIZED=YES',
              ':latest',
          ]
          present = [value for value in forbidden if value in text]
          assert not present, f'forbidden or competing authority claims: {present}'
          print('CODESTRA_BLACKBOX_EXPORTER_PRODUCTION_API_CONTRACT=PASS')
          PY
